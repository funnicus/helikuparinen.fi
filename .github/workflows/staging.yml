name: Staging checks

on:
    push:
        branches:
            - staging
    pull_request:
        branches:
            - staging
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

jobs:
    checks:
        name: Quality checks
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Check dead code
              run: pnpm knip

            - name: Audit dependencies
              run: pnpm audit:critical

            - name: Build
              run: pnpm build
              env:
                  SPACE_ID: ${{ secrets.SPACE_ID }}
                  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
                  PREVIEW_ACCESS_TOKEN: ${{ secrets.PREVIEW_ACCESS_TOKEN }}
